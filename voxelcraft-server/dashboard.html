<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxelCraft 服务器控制台</title>
<style>
  :root{--bg:#0f1220;--card:#1a1f33;--card2:#222a44;--green:#2ecc71;--blue:#3498db;--red:#e74c3c;--txt:#e8eaf0;--mut:#9aa3b2}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:12px;padding:16px 22px;background:linear-gradient(90deg,#16203a,#0f1220);border-bottom:1px solid #2a3354}
  header .dot{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
  header .dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
  header h1{font-size:18px;margin:0}
  header .sub{color:var(--mut);font-size:12px}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px;max-width:1100px;margin:0 auto}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  .card h2{margin:0 0 12px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #232a44;font-size:14px}
  .row:last-child{border-bottom:none}
  .row b{font-weight:600}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--green)}
  button{background:var(--card2);color:var(--txt);border:1px solid #313a5e;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600}
  button:hover{border-color:var(--blue)}
  button.green{background:var(--green);color:#06210f;border-color:var(--green)}
  button.red{background:var(--red);color:#2a0606;border-color:var(--red)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  input,textarea{width:100%;background:#0e1322;border:1px solid #313a5e;border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13px;margin-top:4px}
  label{font-size:12px;color:var(--mut);display:block;margin-top:10px}
  .players{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto}
  .players li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #232a44;font-size:13px}
  .sw{width:12px;height:12px;border-radius:3px}
  #logs{background:#0a0e1a;border:1px solid #232a44;border-radius:8px;padding:10px;height:300px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:#bcd}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;background:var(--card2);color:var(--mut)}
  .copy{cursor:pointer;color:var(--blue);font-size:12px;margin-left:6px}
  .auto{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
  a.dl{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span>
  <div>
    <h1>VoxelCraft 服务器控制台</h1>
    <div class="sub" id="verSub">加载中…</div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>运行状态</h2>
    <div class="row"><span>状态</span><b id="stState">—</b></div>
    <div class="row"><span>端口</span><b class="mono" id="stPort">—</b></div>
    <div class="row"><span>在线玩家</span><b id="stPlayers">0</b></div>
    <div class="row"><span>已运行</span><b id="stUptime">—</b></div>
    <div class="row"><span>局域网地址</span><b class="mono" id="stLan">—</b><span class="copy" onclick="copy('stLan')">复制</span></div>
    <div class="row"><span>公网地址</span><b class="mono" id="stPub">未获取</b><span class="copy" onclick="copy('stPub')">复制</span></div>
    <div class="btns">
      <button class="green" id="btnStart" onclick="ctrl('start')">启动</button>
      <button class="red" id="btnStop" onclick="ctrl('stop')">停止</button>
      <button onclick="ctrl('restart')">重启</button>
    </div>
  </div>

  <div class="card">
    <h2>设置</h2>
    <label>服务器名称</label><input id="setName" placeholder="VoxelCraft 服务器">
    <label>欢迎语 (MOTD)</label><input id="setMotd" placeholder="欢迎来到方块世界！">
    <label>最大玩家数</label><input id="setMax" type="number" min="1" max="999" value="50">
    <label>端口 (更改将重启)</label><input id="setPort" type="number" min="1" max="65535" value="8080">
    <div class="btns"><button class="green" onclick="saveSettings()">保存设置</button></div>
    <div class="auto">
      <input type="checkbox" id="autoChk" onchange="toggleAuto(this.checked)">
      <label style="margin:0">开机自启动（Windows 托盘 / Linux 桌面）</label>
    </div>
  </div>

  <div class="card">
    <h2>在线玩家</h2>
    <ul class="players" id="plist"><li style="color:var(--mut)">暂无玩家</li></ul>
  </div>

  <div class="card">
    <h2>实时日志</h2>
    <div id="logs"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let lastLogs = "";

async function api(path, opt){ const r = await fetch(path, opt); return r.json(); }
function fmtUptime(ms){
  if(!ms) return "—";
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return (h?h+"时":"")+(m?m+"分":"")+sec+"秒";
}
function copy(id){
  const t = $(id).textContent.trim();
  if(t && t!=="未获取"){ navigator.clipboard.writeText(t).then(()=>{}); }
}
async function load(){
  const d = await api("/api/status");
  if(!d.ok) return;
  $("statusDot").className = "dot" + (d.running?" on":"");
  $("stState").textContent = d.running ? "运行中" : "已停止";
  $("stState").style.color = d.running ? "var(--green)" : "var(--red)";
  $("stPort").textContent = d.port;
  $("stPlayers").textContent = d.players;
  $("stUptime").textContent = fmtUptime(d.uptime);
  $("stLan").textContent = d.wsURL || ("ws://"+d.lanIP+":"+d.port);
  $("stPub").textContent = d.publicIP ? ("ws://"+d.publicIP+":"+d.port) : "未获取（需自行端口映射/隧道）";
  $("verSub").textContent = "软件 v"+d.version+" · 协议 v"+d.protocol+" · 兼容所有客户端版本";
  $("setName").value = d.serverName||""; $("setMotd").value = d.motd||"";
  $("setMax").value = d.maxPlayers||50; $("setPort").value = d.port;
  $("autoChk").checked = !!d.autostart;
  // players
  const ul = $("plist");
  if(d.playerList && d.playerList.length){
    ul.innerHTML = d.playerList.map(p=>{
      const nm = p.name||p.username||("玩家"+p.id);
      return `<li><span class="sw" style="background:${p.color||'#888'}"></span>${escapeHtml(nm)} <span class="pill">#${p.id}</span></li>`;
    }).join("");
  } else ul.innerHTML = '<li style="color:var(--mut)">暂无玩家</li>';
}
async function ctrl(a){
  const d = await api("/api/control",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:a})});
  if(d.ok) load(); else alert(d.msg||"操作失败");
}
async function saveSettings(){
  const d = await api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({serverName:$("setName").value, motd:$("setMotd").value, maxPlayers:+$("setMax").value||50, port:+$("setPort").value||8080})});
  if(d.ok){ alert(d.restarted?"已保存并重启服务":"已保存"); load(); } else alert(d.msg||"保存失败");
}
async function toggleAuto(on){
  await api("/api/autostart",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:on})});
  load();
}
async function loadLogs(){
  const d = await api("/api/logs?tail=300");
  if(d.ok){ const txt = d.logs.join("\n"); if(txt!==lastLogs){ lastLogs=txt; const el=$("logs"); el.textContent=txt; el.scrollTop=el.scrollHeight; } }
}
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
load(); loadLogs();
setInterval(load, 2000);
setInterval(loadLogs, 2000);
</script>
</body>
</html>
